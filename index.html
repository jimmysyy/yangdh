<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="苹果风格多端自适应导航网站" />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <title>Navigator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
  <link rel="stylesheet" href="./style.css" />

<body>

  <!-- ══ 顶部导航栏 ══ -->
  <header class="navbar" role="banner">
    <button id="hamburger" class="hamburger" aria-label="打开菜单" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a class="navbar-logo" href="#" aria-label="首页">
      <div class="logo-icon" id="logoIcon"></div>
      <span class="logo-text" id="logoText"></span>
    </a>
    <div class="navbar-search" role="search">
      <div class="search-wrap">
        <span class="search-ico" aria-hidden="true">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </span>
        <input type="search" id="searchInput"
          placeholder="搜索网站…  ⌘K"
          autocomplete="off" autocorrect="off" spellcheck="false"
          aria-label="搜索导航站" />
        <button id="searchClear" class="search-clear" aria-label="清空搜索">✕</button>
      </div>
    </div>
    <div class="navbar-right">
      <button id="themeToggle" class="icon-btn" title="切换深色 / 浅色模式" aria-label="切换主题">🌙</button>
    </div>
  </header>

  <!-- ══ 页面布局 ══ -->
  <div class="layout">

    <!-- 侧边栏 -->
    <aside id="sidebar" class="sidebar" role="navigation" aria-label="分类导航">
      <p class="sidebar-title">分类</p>
      <ul id="sidebarNav" class="sidebar-nav" role="list"></ul>
    </aside>
    <div id="overlay" class="overlay" role="presentation"></div>

    <!-- 主内容区 -->
    <main id="mainArea" class="main" role="main">
      <div class="hero">
        <h1 class="hero-title" id="heroTitle"></h1>
        <p class="hero-sub" id="heroSub"></p>
      </div>

      <!-- 搜索结果（默认隐藏） -->
      <div id="searchResults" aria-live="polite"></div>

      <!-- 分类卡片区 -->
      <div id="catContainer">
        <div class="skeleton-grid">
          <div class="skeleton-card"></div><div class="skeleton-card"></div>
          <div class="skeleton-card"></div><div class="skeleton-card"></div>
        </div>
        <div class="skeleton-grid">
          <div class="skeleton-card"></div><div class="skeleton-card"></div>
          <div class="skeleton-card"></div><div class="skeleton-card"></div>
        </div>
      </div>

      <footer class="footer" role="contentinfo">
        <div class="footer-info" id="footerInfo"></div>
        <div class="load-time" id="loadTime" aria-live="polite" aria-atomic="true"></div>
      </footer>
    </main>
  </div>

  <!-- 返回顶部 -->
  <button id="scrollTop" aria-label="返回顶部" title="返回顶部">↑</button>

  <!-- 密码验证弹窗 -->
  <div id="passwordModalOverlay" class="modal-overlay" role="presentation"></div>
  <div id="passwordModal" class="modal" role="dialog" aria-labelledby="passwordModalTitle" aria-modal="true">
    <button id="passwordModalClose" class="modal-close" aria-label="关闭弹窗">✕</button>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="passwordModalTitle">需要密码验证</h2>
        <p id="passwordModalDesc">此分类需要密码验证后才能查看</p>
      </div>
      <div class="modal-body">
        <div class="password-input-group">
          <input type="password" id="passwordInput" placeholder="请输入密码" class="password-input" autocomplete="off" />
          <button id="passwordToggle" class="password-toggle" title="显示/隐藏密码">👁️</button>
        </div>
        <p class="password-hint" id="passwordHint">关注公众号获取密码</p>
      </div>
      <div class="modal-footer">
        <button id="passwordSubmit" class="btn btn-primary">验证密码</button>
        <button id="passwordShowWechat" class="btn btn-secondary">关注公众号获取</button>
      </div>
    </div>
  </div>

  <!-- 公众号推荐弹窗 -->
  <div id="modalOverlay" class="modal-overlay" role="presentation"></div>
  <div id="modal" class="modal" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
    <button id="modalClose" class="modal-close" aria-label="关闭弹窗">✕</button>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">公众号推荐</h2>
        <p id="modalDesc"></p>
      </div>
      <div class="modal-body">
        <div id="modalQRCode" class="modal-qrcode"></div>
        <div id="modalInfo" class="modal-info"></div>
      </div>
      <div class="modal-footer">
        <button id="modalGo" class="btn btn-primary">前往网站</button>
        <button id="modalSkip" class="btn btn-secondary">关闭</button>
      </div>
    </div>
  </div>

  <!-- 脚本 -->
  <script src="./main.js" defer></script>
